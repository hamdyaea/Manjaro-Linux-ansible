- name: Upgrade Manjaro or Arch Linux hosts with pacman
  hosts: control
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Upgrade installed packages and refresh pacman databases
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: ansible_facts.os_family == "Archlinux"
